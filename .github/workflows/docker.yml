name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # Tags are only built when the tagged commit is on main or a release-N branch.
  check:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: check
        run: |
          allowed=true
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            commit=$(git rev-parse "$GITHUB_REF^{commit}")
            if ! git branch -r --contains "$commit" | grep -Eq '^\s*origin/(main|release-[0-9]+)$'; then
              echo "Tag ${GITHUB_REF_NAME} is not on main or a release-N branch, skipping build"
              allowed=false
            fi
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Remove images that lost their tag (e.g. previous "main" builds).
      - uses: actions/delete-package-versions@v5
        if: github.event_name != 'pull_request'
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: 0
